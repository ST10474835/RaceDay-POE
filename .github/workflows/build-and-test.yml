name: Build and Test RaceDay

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore Part2-API/RaceDay.Api.Tests/RaceDay.Api.Tests.csproj

      - name: Build API project
        run: dotnet build Part2-API/RaceDay.Api.csproj --configuration Release --no-restore

      - name: Build test project
        run: dotnet build Part2-API/RaceDay.Api.Tests/RaceDay.Api.Tests.csproj --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test Part2-API/RaceDay.Api.Tests/RaceDay.Api.Tests.csproj --configuration Release --no-build --verbosity normal

      - name: Restore MVC project
        run: dotnet restore Part3-Web/RaceDay.Web.csproj

      - name: Build MVC project
        run: dotnet build Part3-Web/RaceDay.Web.csproj --configuration Release --no-restore

      - name: Build MVC Docker image
        run: docker build -t raceday-web Part3-Web
